services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: semsobra
      POSTGRES_USER: semsobra
      POSTGRES_PASSWORD: semsobra
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semsobra -d semsobra"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./api
    environment:
      DB_URL: jdbc:postgresql://db:5432/semsobra
      DB_USERNAME: semsobra
      DB_PASSWORD: semsobra
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
