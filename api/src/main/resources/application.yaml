spring:
  application:
    name: sem-sobra-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/semsobra}
    username: ${DB_USERNAME:semsobra}
    password: ${DB_PASSWORD:semsobra}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
